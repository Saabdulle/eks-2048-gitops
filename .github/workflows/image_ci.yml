name: 2048 Image CI

on:
  pull_request:
    branches: [production, deployment]
  push:
    branches: [production]
    paths:
      - "app/**"
      - ".github/workflows/image-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan 2048 image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: eks-2048

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --platform linux/amd64 --tag eks-2048:ci ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eks-2048:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Authenticate to AWS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: "true"

      - name: Push scanned image to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"

          docker tag eks-2048:ci "$image"
          docker push "$image"