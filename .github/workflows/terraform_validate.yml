name: Terraform CI

on:
  pull_request:
    branches: [deployment, production]
  push:
    branches: [production]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.17.2"

defaults:
  run:
    working-directory: terraform/infra

jobs:
  validate:
    name: Format and Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.2"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform for Validation
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate
      - name: Checkov to Scan Terraform 
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform/infra
          framework: terraform
          output: cli
          soft-fail: false

  plan:
    name: Terraform Plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.2"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-west-2
          mask-aws-account-id: "true"

      - name: Initialise Terraform with S3 Backend
        run: terraform init -input=false

      - name: Preview Infrastructure Changes
        env:
          TF_VAR_eks_api_public_access_cidrs: ${{ secrets.TF_EKS_API_PUBLIC_ACCESS_CIDRS }}
        run: terraform plan -input=false -no-color -lock-timeout=60s